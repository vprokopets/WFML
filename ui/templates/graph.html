<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Views</title>
    <style>
        .content-div {
            display: none; /* Initially hide all content divs */
            padding: 20px;
            margin: 20px;
            border: 1px solid #ccc;
            transition: opacity 0.3s ease;
        }
        .content-div.active {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Dynamic View Switching</h1>

    <button id="text-btn">Show Text</button>
    <button id="image-btn">Show Image</button>

    <div id="text-container" class="content-div active">
      <div>
         <h2>This is a Text View</h2>
         <p>
           Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
         </p>
       </div>
    </div>

    <div id="image-container" class="content-div">
      <div>
        <h2>This is an Image View</h2>
        <img src="/static/my_image.jpg" alt="My Image" style="max-width: 300px">
      </div>
    </div>
    <script>
     document.addEventListener('DOMContentLoaded', function() {
       const textContainer = document.getElementById('text-container');
       const imageContainer = document.getElementById('image-container');

       const textBtn = document.getElementById('text-btn');
       const imageBtn = document.getElementById('image-btn');

        function showContent(containerToShow) {
              const containers = [textContainer, imageContainer];
              containers.forEach((container) => {
                if(container === containerToShow){
                    container.classList.add('active');
                } else {
                    container.classList.remove('active');
                 }
              });
          }


        textBtn.addEventListener('click', () => {
            showContent(textContainer);
        });

        imageBtn.addEventListener('click', () => {
            showContent(imageContainer);
        });
     });
    </script>
</body>
</html>
